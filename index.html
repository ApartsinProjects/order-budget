const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.salt),iterations:D.iter,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},k,b64(D.ct));
  return new TextDecoder().decode(pt);
}
async function show(pw,remember){
  const html=await open(pw);
  if(remember){try{sessionStorage.setItem("pw",pw)}catch(e){}}
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const err=document.getElementById("err");err.textContent="";
  try{await show(document.getElementById("pw").value,true)}catch(x){err.textContent="Wrong password. Try again."}
});
(async()=>{let p=null;try{p=sessionStorage.getItem("pw")}catch(e){}if(p){try{await show(p,false)}catch(e){}}})();
